[package]
name = "mcp-learner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "MCP Server → CI-144 工具定义的自动学习器"

[features]
# 默认启用 glove 模块（已 deprecated，编译时警告）
# 使用 --no-default-features 可完全排除 glove 模块
# CI 中可配置为禁止使用该 feature，强制迁移至 HelixECO-Glove
default = ["glove"]
glove = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
thiserror = "1"
# SHA-256 哈希（用于计算 MCP 代理执行体的完整性哈希）
sha2 = "0.10"
# HelixECO-Glove core：提供 StaticReviewer（L1 静态审查）和 EcoGlove trait
helix-eco-glove-core = { path = "../HelixECO-Glove/core" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mcp-learner"
path = "src/main.rs"
